# GitHub Actions: build the distributables on every push, publish a
# GitHub Release when a v* tag is pushed.
#
#   push to main        -> both jobs build, artifacts land under the
#                          run's "Artifacts" section (good for testing)
#   push tag v0.1.0     -> same builds, then both files are attached to
#                          a Release so people can just hit Downloads
#
# The Windows job is also the FIRST real compile of the Win32 backends:
# it runs dist/windows/build-msys2.sh inside an MSYS2 UCRT64 shell,
# exactly like a local build would.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # release creation on tag pushes

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-tomlplusplus
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis

      - name: Build bundle + installer
        shell: msys2 {0}
        run: dist/windows/build-msys2.sh

      # Unsigned installer, exactly as SignPath's artifact configuration
      # expects it: origin verification pulls it from GitHub artifacts.
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: cabal-overlay-setup-unsigned
          if-no-files-found: error
          path: dist/out/cabal-overlay-*-setup.exe

      # The raw bundle (exe + DLLs + config + data) for testing without
      # installing anything.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabal-overlay-windows
          if-no-files-found: error
          path: dist/out/windows/

      # Code signing via SignPath Foundation (free for open source).
      # Skipped entirely until the SIGNPATH_TOKEN secret and the
      # SIGNPATH_* repository variables exist — the pipeline stays
      # functional (unsigned) in the meantime.
      - name: Submit to SignPath for signing
        if: ${{ secrets.SIGNPATH_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-name: cabal-overlay-setup-unsigned
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installer
        if: ${{ secrets.SIGNPATH_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cabal-overlay-setup-windows-signed
          path: signed/

      - name: Publish signed installer on tag
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          files: signed/cabal-overlay-*-setup.exe

      - name: Publish unsigned installer on tag (pre-SignPath fallback)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_TOKEN == ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/out/cabal-overlay-*-setup.exe

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # gtk4-layer-shell has no package in Ubuntu 24.04 (noble), so it
      # is built from source — a small meson project, under a minute.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config meson \
            libgtk-4-dev libcanberra-dev libx11-dev \
            libtomlplusplus-dev nlohmann-json3-dev \
            libgirepository1.0-dev libwayland-bin valac

      - name: Build gtk4-layer-shell from source
        run: |
          git clone --depth 1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          meson setup --prefix=/usr /tmp/gtk4-layer-shell/build /tmp/gtk4-layer-shell
          meson compile -C /tmp/gtk4-layer-shell/build
          sudo meson install -C /tmp/gtk4-layer-shell/build
          sudo ldconfig

      - name: Build tarball
        run: dist/linux/package.sh

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabal-overlay-tarball-linux
          path: dist/out/cabal-overlay-*-linux-x86_64.tar.gz

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/out/cabal-overlay-*-linux-x86_64.tar.gz
