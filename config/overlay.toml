# Cabal Overlay — configuration
# All times are server time (Europe/Berlin, CET/CEST handled automatically).

[overlay]
# anchor: edge keywords ("top-left", "bottom-right", "right", ...) or
# "custom" for a free position. With "custom" the margins are the
# absolute x/y offset from the TOP-LEFT corner of the screen (drag the
# bar while the overlay is interactive and it saves itself here).
anchor = "custom"
margin_x = 351  # horizontal distance from screen edge (from corner if custom)
margin_y = 1009  # vertical distance from screen edge (from corner if custom)
# Whole-bar fade (text included). 1.0 = fully opaque. The bar's
# background translucency lives in the CSS, not here.
opacity = 1.0
theme = "prosperity"        # prosperity | procyon | capella (not wired yet)
max_countdowns = 1
# Hide the overlay whenever the game window does not hold the input
# focus (alt-tab to the browser/desktop, game minimized or closed).
# The watcher finds the game through X11 — it runs under XWayland —
# and needs no extra permissions. False = always float on top.
show_only_when_game_focused = true

[panel]
visible = true
anchor = "custom"  # a single edge (no top/bottom) centers vertically
# "custom" works here too: drag the panel while interactive and it
# saves its absolute position in margin_x/margin_y (see [overlay]).
margin_x = 1238
margin_y = 792
opacity = 0.9

# How the global "make overlay clickable" combo reaches the app.
#
#   "external" → RECOMMENDED. A desktop shortcut calls the D-Bus
#                action toggle-interactive. No extra permissions.
#                KDE: System Settings → Shortcuts → Custom Shortcuts →
#                New → Command/URL, command:
#                  gdbus call --session --dest dev.cabal.Overlay \
#                    --object-path /dev/cabal/Overlay \
#                    --method org.gtk.Actions.Activate toggle-interactive [] {}
#   "evdev"    → The app reads /dev/input directly. Works while the
#                game holds focus, no desktop setup — BUT it needs
#                your user in the "input" group (sudo usermod -aG
#                input $USER, re-login). WARNING: that group lets ANY
#                process running as your user silently read every
#                keystroke, exactly like a keylogger, forever. The
#                overlay itself records nothing (verifiable in the
#                source), but the door stays open for anything else.
#                See docs/04-hotkey-modes.md before enabling.
#   "disabled" → No global combo. D-Bus action still callable by hand.
[hotkey]
mode = "external"
combo = "Shift+Space"       # only read in "evdev" mode

# ─────────────────────────────────────────────────────────────
# DG check — screen-zone dungeon-clear counter.
#
# Cabal's dungeon-end dialog always appears at the same screen spot
# and must be clicked to dismiss it. When enabled, a click landing
# inside the rectangle below counts as one dungeon clear and adds +1
# to the first task in the goals panel. Nothing is read from memory:
# the app only polls the pointer position through the plain X11
# client library, same as any regular application.
#
# Coordinates are absolute screen pixels; the captured click is the
# CENTER of the rectangle (x = center - width/2, y = center -
# height/2). Calibrate from the settings window (DG Check tab):
# click the exact dialog spot once and the zone is saved here
# automatically.
#
# "require_ctrl = true" means only CTRL+click counts — holding CTRL
# is the marker "this click was meant for the counter, not the game".
[dgcheck]
enabled = true
x = 850
y = 499
width = 240
height = 120
require_ctrl = true

[alarms]
enabled = true
volume = 50                 # 0-100
warn_before_min = 5
daily = true
weekly = true
gdg = true
world_boss = true
nation_war = true

# Schedules below mirror Prosperity Task Tracker v6.1.
# Edit here if the server or clan changes them — no recompile needed.

[[schedule]]
id = "daily_reset"
name = "Daily Reset"
kind = "daily"
times = ["00:00"]
alarm = "daily"

[[schedule]]
id = "weekly_reset"
name = "Weekly Reset"
kind = "weekly"
weekday = "wednesday"
time = "00:00"
alarm = "weekly"

[[schedule]]
id = "gdg"
name = "Guild Dungeon"
kind = "daily"
times = ["00:00", "19:55"]
alarm = "gdg"

[[schedule]]
id = "world_boss"
name = "World Boss"
kind = "daily"
times = ["09:30", "21:30"]
alarm = "world_boss"

[[schedule]]
id = "nation_war"
name = "Nation War"
kind = "daily"
times = ["01:00", "04:00", "07:00", "10:00", "13:00", "16:00", "19:00", "22:00"]
alarm = "nation_war"
